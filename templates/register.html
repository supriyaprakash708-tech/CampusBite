
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | CampusBite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">

            <a href="{{ url_for('home') }}" class="auth-logo">
                Campus<span>Bite.</span>
            </a>

            <p class="auth-eyebrow">GET STARTED</p>
            <h1>Create your account</h1>
            <p class="auth-description">
                Register once and enjoy simple, convenient food ordering.
            </p>

            {% if message %}
                <div class="message {{ message_type }}">
                    {{ message }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>
                </div>

                <div class="form-group">
                    <label for="college_name">College / Organization Name</label>
                    <input
                        type="text"
                        id="college_name"
                        name="college_name"
                        placeholder="College name or Visitor / Not affiliated"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <p class="auth-link">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

            <a href="{{ url_for('home') }}" class="back-link">
                ← Back to Home
            </a>

        </div>
    </div>

</body>
</html>
